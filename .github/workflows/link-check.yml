name: Link check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'
  push:
    branches: [release]
    paths:
      - '**/*.md'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee on all markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,204,206,301,302,307,308,429
            --exclude-path .obsidian
            --exclude-path .github
            --exclude '^file://'
            --exclude '^[^:]+\.(png|jpg|jpeg|gif|svg|pdf)(\|.*)?$'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
