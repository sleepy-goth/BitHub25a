name: Wikilink check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/scripts/check-wikilinks.py'
      - '.github/workflows/wikilink-check.yml'
  push:
    branches: [release]
    paths:
      - '**/*.md'
      - '.github/scripts/check-wikilinks.py'
      - '.github/workflows/wikilink-check.yml'
  workflow_dispatch:

jobs:
  wikilinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determina i .md modificati
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          HEAD="$HEAD_SHA"
          # primo push del branch o base assente: confronta col commit genitore
          if [ -z "$BASE" ] || \! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse "${HEAD}^" 2>/dev/null || echo "$HEAD")"
          fi
          git -c core.quotepath=false diff --name-only --diff-filter=d "$BASE" "$HEAD" -- '*.md' \
            | grep -vE '^\.(github|obsidian|claude)/' > changed.txt || true
          echo "Note .md modificate:"; cat changed.txt

      - name: Verifica i wikilink interni dei file modificati
        run: |
          mapfile -t FILES < changed.txt
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "Nessuna nota .md modificata: niente da verificare."
            exit 0
          fi
          python3 .github/scripts/check-wikilinks.py --strict "${FILES[@]}"
